name: Build and Push Docker Images

on:
  release:
    types: [published]

jobs:
  build-backend:
    name: Build & Push Backend
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to private registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/client-support/backend:${{ github.event.release.tag_name }}
            ${{ vars.DOCKER_REGISTRY }}/client-support/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Log in to private registry
        uses: docker/login-action@v2
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          build-args: |
            BACKEND_URL=${{ vars.BACKEND_URL }}
            NEXT_PUBLIC_COMPANY_ID=${{ vars.NEXT_PUBLIC_COMPANY_ID }}
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/client-support/app:${{ github.event.release.tag_name }}
            ${{ vars.DOCKER_REGISTRY }}/client-support/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Swarm
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare stack file for deployment
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          envsubst '${DB_PASSWORD}' < docker-stack.yml > client-suport.yaml

      - name: Copy stack file to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "client-suport.yaml"
          target: "/root/workdir"

      - name: Deploy to Docker Swarm via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /root/workdir
            docker stack deploy --with-registry-auth -c client-suport.yaml client-support
